name: Monitor Releases

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Watch packages
        continue-on-error: true
        run: pkgtruth watch watchlist.example.yml --json reports/ --no-llm --fail-on medium

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: pkgtruth-reports
          path: reports/
